input {
  beats {
    port => 5044
  }
}

filter {
  # Format brut BGL (Loghub) :
  # Label Timestamp Date Node Time NodeRepeat Type Component Level Content
  grok {
    match => {
      "message" => "%{NOTSPACE:bgl_label} %{NUMBER:bgl_timestamp} %{NOTSPACE:bgl_date} %{NOTSPACE:bgl_node} %{NOTSPACE:bgl_time} %{NOTSPACE:bgl_noderepeat} %{NOTSPACE:bgl_type} %{NOTSPACE:bgl_component} %{NOTSPACE:bgl_level} %{GREEDYDATA:bgl_content}"
    }
    tag_on_failure => ["_grokparsefailure_bgl"]
  }

  mutate {
    add_field => { "is_anomaly" => "false" }
  }

  if [bgl_label] and [bgl_label] != "-" {
    mutate {
      replace => { "is_anomaly" => "true" }
      add_field => { "anomaly_label" => "%{bgl_label}" }
    }
  }

  date {
    match => ["bgl_timestamp", "UNIX"]
    target => "@bgl_event_time"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "bgl-replay-%{+YYYY.MM.dd}"
  }
  # Decommente la ligne suivante pendant le debug pour voir les evenements
  # parses directement dans les logs de logstash :
  # stdout { codec => rubydebug }
}
